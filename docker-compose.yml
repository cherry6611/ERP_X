services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请设置 POSTGRES_DB}
    ports:
      # 仅本机可达，避免云主机公网暴露 Postgres
      - "127.0.0.1:5432:5432"
    volumes:
      - erp-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 显式声明生产环境。注意：`runtime-env.ts` 是 fail-safe 的 ——
      # 除显式 `development` 外一律按生产标准执行（密钥强度、Cookie Secure、
      # 异常不回显堆栈、飞书事件校验不可逃逸），因此漏设也是安全的；
      # 这里显式写出来是为了让"当前是生产"这件事可读、可审计。
      NODE_ENV: production
      # 修复 P0-1（部署）：容器内 127.0.0.1 指容器自身，透传宿主机的 DATABASE_URL
      # 会让 db-migrate 连不上库 → command 短路 → 容器启动失败。
      # 默认走 compose 自带的 postgres 服务名；如需连外部库，用 DATABASE_URL 覆盖即可。
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      SECRET_ENC_KEY: ${SECRET_ENC_KEY:?请设置 SECRET_ENC_KEY}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      # 修复 P1-5：容器内 NODE_ENV=production，飞书事件校验是 fail-closed 的，
      # 缺 token 会拒绝全部回调（通讯录同步/审批事件全失效），必须显式注入。
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      # 本地首次 up 允许为空；生产务必在 .env 填真实 verification token
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_BITABLE_APP_TOKEN: ${FEISHU_BITABLE_APP_TOKEN:-}
      FEISHU_BITABLE_COST_TABLE: ${FEISHU_BITABLE_COST_TABLE:-}
      FEISHU_BITABLE_CONTRACT_TABLE: ${FEISHU_BITABLE_CONTRACT_TABLE:-}
      FEISHU_BITABLE_TIMESHEET_TABLE: ${FEISHU_BITABLE_TIMESHEET_TABLE:-}
      FEISHU_FALLBACK_RECEIVER: ${FEISHU_FALLBACK_RECEIVER:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      APP_BASE_URL: ${APP_BASE_URL:-}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      # A7：反代后正确识别客户端 IP，避免全局限速误伤
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "3000:3000"
    volumes:
      - erp-uploads:/app/data/uploads
    mem_limit: 1g
    command: sh -c "node scripts/db-migrate.mjs && node dist/server/main.js"
volumes:
  erp-pg:
  erp-uploads:
