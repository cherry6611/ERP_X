name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run type:check
      - run: npm run lint
      - run: npm run check:need-login
      - run: npm run check:contract
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      # U-25：构建产物冒烟（无 DB 时仅校验 dist 存在；有 DATABASE_URL 可扩）
      - name: smoke dist
        run: |
          test -f dist/server/main.js || test -f dist/main.js || ls dist
          test -d dist/client
